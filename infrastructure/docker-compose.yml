services:
  postgres:
    image: postgres:16-alpine
    container_name: pursuit-postgres
    environment:
      POSTGRES_USER: pursuit
      POSTGRES_PASSWORD: pursuit
      POSTGRES_DB: pursuit
    ports:
      - '54329:5432'
    volumes:
      - pursuit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pursuit -d pursuit']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: pursuit-redis
    ports:
      - '63799:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pursuit_pgdata:
