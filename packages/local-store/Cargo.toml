[package]
name = "pursuit-local-store"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
